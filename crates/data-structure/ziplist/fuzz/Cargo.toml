[package]
name = "ziplist-fuzz"
version = "0.0.0"
authors = ["Automatically generated"]
publish = false
edition = "2018"

[package.metadata]
cargo-fuzz = true

[dependencies]
arbitrary = { version = "1", features = ["derive"] }
libfuzzer-sys = "0.4"

[dependencies.ziplist]
path = ".."

# Prevent this from interfering with workspaces
[workspace]
members = ["."]

[[bin]]
name = "decode"
path = "fuzz_targets/decode.rs"
test = false
doc = false

[[bin]]
name = "ops"
path = "fuzz_targets/ops.rs"
test = false
doc = false

[[bin]]
name = "typed_ops"
path = "fuzz_targets/typed_ops.rs"
test = false
doc = false
