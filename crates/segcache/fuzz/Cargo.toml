[package]
name = "segcache-fuzz"
version = "0.0.0"
authors = ["Automatically generated"]
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.segcache]
path = ".."
# `debug` gives the target check_integrity() and items() for its
# end-of-input invariant sweep.
features = ["debug"]

# Prevent this from interfering with workspaces
[workspace]
members = ["."]

[[bin]]
name = "segcache"
path = "fuzz_targets/segcache.rs"
test = false
doc = false
