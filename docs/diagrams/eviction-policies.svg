<line x1="20" y1="430" x2="960" y2="430" stroke="#1a2433" stroke-width="0.8" stroke-dasharray="2 4"/>
<text x="20" y="452" text-anchor="start" font-size="11.5" font-family="inherit" fill="#1a2433" stroke="none">Shared, before any policy runs:  expire() frees whole expired segments first — eviction is the fallback.</text>
<text x="20" y="472" text-anchor="start" font-size="11.5" font-family="inherit" fill="#1a2433" stroke="none">can_evict = evictable state &amp;&amp; ref_count == 0 — the Live write tail (dashed) and reader-pinned segments are never selected.</text>
<text x="20" y="492" text-anchor="start" font-size="11.5" font-family="inherit" fill="#1a2433" stroke="none">Fifo / Cte / Util rerank a sorted segment list (at most once per second); Random / RandomFifo sample statelessly.</text>
<text x="20" y="512" text-anchor="start" font-size="11.5" font-family="inherit" fill="#1a2433" stroke="none">All five drop the selected segment whole: every item in it is evicted in one step.  Policy::None skips selection — inserts fail when full.</text>
<text x="960" y="532" text-anchor="end" font-size="9.5" font-family="ui-monospace,monospace" fill="#1a2433" stroke="none" opacity="0.55">derived from cache-rs @ 073cce5</text>
