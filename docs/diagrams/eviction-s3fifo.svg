<text x="20" y="432" text-anchor="start" font-size="11" font-family="inherit" fill="#1a2433" stroke="none">One-hit wonders die in admission; a ghost hit is the proof of a second request, earning direct main placement.</text>
<text x="20" y="452" text-anchor="start" font-size="11" font-family="inherit" fill="#1a2433" stroke="none">Promotion and second-chance copies reuse the merge relink machinery: copy bytes, then Release-CAS the hashtable location.</text>
<text x="960" y="464" text-anchor="end" font-size="9.5" font-family="ui-monospace,monospace" fill="#1a2433" stroke="none" opacity="0.55">derived from cache-rs @ 073cce5</text>
