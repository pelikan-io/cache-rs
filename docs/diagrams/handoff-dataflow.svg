<text x="624" y="255" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" fill="#222222">append to store buffer</text>
<text x="612" y="278" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" font-style="italic" fill="#555555">pipelined same-key GET is forwarded from here</text>
