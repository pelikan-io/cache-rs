<rect x="174.8" y="200" width="107.19999999999999" height="22" fill="#FBB4AE" stroke="#222222" stroke-width="0.8" rx="4"/>
<text x="182.8" y="215.5" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="start" fill="#222222">direct reads</text>
<rect x="290" y="200" width="236.39999999999998" height="22" fill="#CCEBC5" stroke="#222222" stroke-width="0.8" rx="4"/>
<text x="298" y="215.5" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="start" fill="#222222">store buffer (pending writes)</text>
<rect x="560" y="322" width="580" height="92" fill="none" stroke="#222222" stroke-width="1.2" rx="0"/>
<text x="572" y="346" font-family="Helvetica, Arial, sans-serif" font-size="17" text-anchor="start" fill="#222222">owner thread ×S</text>
<text x="572" y="364" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" fill="#555555">single writer per key range</text>
<rect x="572" y="376" width="107.19999999999999" height="22" fill="#CCEBC5" stroke="#222222" stroke-width="0.8" rx="4"/>
<text x="580" y="391.5" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="start" fill="#222222">apply writes</text>
