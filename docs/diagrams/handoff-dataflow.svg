<text x="40" y="626" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" font-style="italic" fill="#555555">† design contract (reply released only after W5 publish — reply-after-apply); segbench models the throughput path, not reply release.</text>
<text x="40" y="646" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" font-style="italic" fill="#555555">RMW/CAS ops travel the write path and return applied state in the ack; `noreply` forms may skip W6/W7 — they are the protocol's early-ack path.</text>
