<text x="774" y="492" font-family="DejaVu Sans Mono, Menlo, monospace" font-size="14" text-anchor="start" fill="#222222">segments + tails + free pool + merge</text>
<text x="430" y="538" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" font-style="italic" fill="#555555">the pointer swing is the linearization point; readers pin + revalidate (unchanged from 0.4.x)</text>
<text x="60" y="345" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="start" font-weight="bold" fill="#555555">READ PATH</text>
<text x="60" y="364" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" font-style="italic" fill="#555555">never queues</text>
