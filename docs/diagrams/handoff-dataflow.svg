<text x="695.2" y="391.5" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="start" fill="#222222">TTL stripe = private tail</text>
<rect x="40" y="454" width="1100" height="96" fill="#F2F2F2" stroke="#222222" stroke-width="1.2" rx="0"/>
<text x="52" y="478" font-family="Helvetica, Arial, sans-serif" font-size="17" text-anchor="start" fill="#222222">shared segcache engine</text>
<text x="52" y="496" font-family="DejaVu Sans Mono, Menlo, monospace" font-size="14" text-anchor="start" fill="#555555">Arc&lt;Segcache&gt;</text>
<rect x="430" y="470" width="300" height="34" fill="white" stroke="#222222" stroke-width="1.2" rx="0"/>
<text x="444" y="492" font-family="DejaVu Sans Mono, Menlo, monospace" font-size="14" text-anchor="start" fill="#222222">hashtable — publish point</text>
