<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 700" font-family="Helvetica, Arial, sans-serif">
<rect width="1180" height="700" fill="white"/>
<text x="40" y="34" font-family="Helvetica, Arial, sans-serif" font-size="20" text-anchor="start" font-weight="bold" fill="#222222">Hybrid handoff — read/write path divergence</text>
<text x="1140" y="34" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="end" fill="#555555">reference architecture · modeled by segbench mode=hybrid @ 761fd7c</text>
<text x="40" y="52" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" font-style="italic" fill="#555555">thread model belongs to the server built on segcache; cache-rs ships the engine band only</text>
<rect x="40" y="60" width="1100" height="66" fill="white" stroke="#222222" stroke-width="1.2" rx="0" stroke-dasharray="6 4"/>
<text x="52" y="84" font-family="Helvetica, Arial, sans-serif" font-size="17" text-anchor="start" font-style="italic" fill="#222222">client connections</text>
<text x="52" y="106" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" font-style="italic" fill="#555555">pipelined requests per connection; replies retired in request order</text>
<rect x="40" y="166" width="1100" height="116" fill="none" stroke="#222222" stroke-width="1.2" rx="0"/>
<text x="52" y="190" font-family="Helvetica, Arial, sans-serif" font-size="17" text-anchor="start" fill="#222222">worker thread ×W</text>
<rect x="52" y="200" width="114.8" height="22" fill="#FBB4AE" stroke="#222222" stroke-width="0.8" rx="4"/>
